[project]
name = "hrady-zamky"
version = "0.1.0"
description = "Data scripts for a personal map of Czech castles and chateaux"
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "requests>=2.34.2",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B905"]  # zip() without strict= is used for equal-length pairs throughout

[dependency-groups]
dev = ["ruff==0.17.2", "playwright"]
